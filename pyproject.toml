[project]
name = "ais-demo"
version = "0.1.0"
description = "Azure Integration Services (AIS) customer demo — governed, event-driven permit-intake flow shown two ways: Azure Portal and the Azure SDK for Python."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "AIS Demo Maintainers" }]
keywords = [
    "azure",
    "integration-services",
    "api-management",
    "logic-apps",
    "service-bus",
    "event-grid",
    "azure-functions",
    "microsoft-foundry",
    "document-intelligence",
]

# Core runtime dependencies (shared application package + FastAPI host).
# Floors are the latest stable releases (verified 2026-09-30); upper bounds stop at the next major.
dependencies = [
    "fastapi>=0.142.2,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-dotenv>=1.2.3,<2",
    "httpx2>=2.13.1,<3",
    "azure-identity>=1.25.3,<2",
    "azure-core>=1.41.0,<2",
    "azure-servicebus>=7.14.3,<8",
    "azure-ai-documentintelligence>=1.0.2,<2",
    "azure-eventgrid>=4.22.1,<5",
    "azure-monitor-query>=2.0.0,<3",
    "azure-monitor-opentelemetry>=1.8.10,<2",
    "openai>=3.22.1,<4",
]

[project.optional-dependencies]
# Microsoft Foundry / Agent Framework (optional grounding + agent orchestration).
foundry = [
    "azure-ai-projects>=2.7.0,<3",
    "agent-framework>=1.19.0,<2",
]
# Developer tooling.
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.9,<0.17",
    "mypy>=2.3.1,<3",
]

[project.scripts]
ais-demo = "ais_demo.demo.run_demo:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ais_demo"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true
packages = ["ais_demo"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
