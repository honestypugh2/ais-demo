name: CI

# Build, lint, type-check, test the Python package, validate the Bicep IaC, and
# build the portal. Deployment (azd + OIDC) lives in deploy.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Functions host imports on the deployed runtime
        working-directory: functionapp
        run: |
          uv venv /tmp/fn --python 3.14
          VIRTUAL_ENV=/tmp/fn uv pip install -r requirements.txt
          /tmp/fn/bin/python -c "import function_app"

  bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Upgrade Bicep CLI
        run: az bicep upgrade

      - name: Build Bicep (lint + compile)
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
